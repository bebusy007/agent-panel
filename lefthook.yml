pre-commit:
  parallel: true
  commands:
    frontend-fmt:
      glob: "web/**/*.{ts,tsx,css,json}"
      run: npx --prefix web prettier --write {staged_files}
      stage_fixed: true
    backend-fmt:
      glob: "src-server/**/*.rs"
      run: cd src-server && cargo fmt
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    frontend-fmt-check:
      glob: "web/**/*.{ts,tsx,css,json}"
      run: npx prettier --check "web/src/**/*.{ts,tsx}"
    backend-fmt-check:
      glob: "src-server/**/*.rs"
      run: cargo fmt --check
    typecheck:
      glob: "web/**/*.{ts,tsx}"
      run: npx tsc --noEmit
    backend-clippy:
      glob: "src-server/**/*.rs"
      run: cargo clippy --workspace
    frontend-test:
      glob: "web/**/*.{ts,tsx}"
      run: npx vitest run
    backend-test:
      glob: "src-server/**/*.rs"
      run: cargo test --workspace
