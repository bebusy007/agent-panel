pre-commit:
  parallel: true
  commands:
    frontend-fmt:
      glob: "web/**/*.{ts,tsx,css,json}"
      run: npx --prefix web prettier --write {staged_files}
      stage_fixed: true
    backend-fmt:
      glob: "src-server/**/*.rs"
      run: cd src-server && cargo fmt
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    frontend-fmt-check:
      glob: "web/**/*.{ts,tsx,css,json}"
      run: cd web && npx prettier --check "src/**/*.{ts,tsx}"
    backend-fmt-check:
      glob: "src-server/**/*.rs"
      run: cd src-server && cargo fmt -- --check
    typecheck:
      glob: "web/**/*.{ts,tsx}"
      run: cd web && npx tsc --noEmit
    backend-clippy:
      glob: "src-server/**/*.rs"
      run: cargo clippy -p agent-panel-server
    frontend-test:
      glob: "web/**/*.{ts,tsx}"
      run: cd web && npx vitest run
    backend-test:
      glob: "src-server/**/*.rs"
      run: cargo test -p agent-panel-server
