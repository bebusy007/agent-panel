[package]
name = "agent-panel-server"
version = "0.0.1"
edition = "2024"
description = "Rust backend for Agent Panel — local AI agent asset dashboard"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "trace", "request-id"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Search
aho-corasick = "1"
memmap2 = "0.9"
rayon = "1"
lru = "0.12"

# File system
walkdir = "2"
notify = "7"
dirs = "6"

# HTTP types (used by tower-http TraceLayer)
http = "1"

# Encoding
base64 = "0.22"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
open = "5"

# Platform
libc = "0.2"

# URL utilities
urlencoding = "2"

# Static file embedding
rust-embed = "8"

# TypeScript type generation
ts-rs = "10"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
axum-test = "20"
pretty_assertions = "1"

[lints.clippy]
# 已有代码中的常见 style 问题，不 block CI，后续逐步清理
collapsible_if = "allow"
collapsible_match = "allow"
redundant_closure = "allow"
redundant_closure_for_method_calls = "allow"
needless_match = "allow"
manual_map = "allow"
single_match = "allow"
branches_sharing_code = "allow"
match_like_matches_macro = "allow"
comparison_chain = "allow"
map_flatten = "allow"
manual_rotate = "allow"
manual_inspect = "allow"
unnecessary_sort_by = "allow"
single_component_path_imports = "allow"
for_kv_map = "allow"
unnecessary_map_or = "allow"
lines_filter_map_ok = "allow"

[lints.rust]
unreachable_patterns = "allow"
dead_code = "allow"
private_interfaces = "allow"
unused_imports = "allow"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
