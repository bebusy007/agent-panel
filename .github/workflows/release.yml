name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build DMG
        run: ./scripts/build-app.sh

      - name: Verify DMG
        run: |
          set -e
          DMG=$(find target src-tauri/target -name "*.dmg" 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG found"
            exit 1
          fi
          echo "DMG: $DMG ($(ls -lh "$DMG" | awk '{print $5}'))"

          echo "--- Mounting DMG ---"
          MOUNT_POINT="/tmp/agent-panel-verify"
          hdiutil attach "$DMG" -mountpoint "$MOUNT_POINT" -nobrowse -quiet

          echo "--- Checking .app bundle ---"
          APP="$MOUNT_POINT/AgentPanel.app"
          [ -d "$APP" ] || { echo "ERROR: .app not found"; hdiutil detach "$MOUNT_POINT" -quiet; exit 1; }
          ls "$APP/Contents/MacOS/"
          ls "$APP/Contents/Resources/" | head -10

          echo "--- Checking sidecar binary ---"
          SIDECAR=$(find "$APP/Contents/MacOS" -name "agent-panel-server*" -type f | head -1)
          [ -n "$SIDECAR" ] || { echo "ERROR: sidecar binary not found"; hdiutil detach "$MOUNT_POINT" -quiet; exit 1; }
          file "$SIDECAR"

          echo "--- Checking web resources ---"
          WEB_DIST=$(find "$APP/Contents/Resources" -name "index.html" -path "*/web/*" | head -1)
          [ -n "$WEB_DIST" ] || { echo "ERROR: web/dist/index.html not found"; hdiutil detach "$MOUNT_POINT" -quiet; exit 1; }
          echo "web resources OK: $WEB_DIST"

          echo "--- Unmounting ---"
          hdiutil detach "$MOUNT_POINT" -quiet
          echo "✅ DMG verified successfully"

      - name: Generate release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${GITHUB_REF_NAME#v}"
          body=$(./scripts/release.sh "$NEW_VERSION")
          echo "Release notes:"
          echo "$body"
          {
            echo 'RELEASE_BODY<<EOF'
            echo "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(find target -name "*.dmg" 2>/dev/null | head -1)
          gh release create "$GITHUB_REF_NAME" \
            --title "Agent Panel $GITHUB_REF_NAME" \
            --notes "${{ steps.notes.outputs.RELEASE_BODY }}" \
            --draft \
            --prerelease \
            "$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: AgentPanel-macos-aarch64
          path: |
            target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/dmg/*.dmg

  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: 'pnpm', cache-dependency-path: 'web/pnpm-lock.yaml' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cd web && pnpm install --frozen-lockfile
      - run: cd web && pnpm build
      - name: Build Tauri app
        run: |
          cargo build --release -p agent-panel-server
          mkdir -p src-tauri/binaries
          cp target/release/agent-panel-server src-tauri/binaries/agent-panel-server-x86_64-unknown-linux-gnu
          cargo install tauri-cli --locked
          cargo tauri build --target x86_64-unknown-linux-gnu
      - name: Verify artifact
        run: |
          find target -name "*.AppImage" -o -name "*.deb" | head -5
          file target/release/agent-panel-server
      - uses: actions/upload-artifact@v5
        with:
          name: AgentPanel-linux-x86_64
          path: target/**/bundle/{appimage,deb}/*

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: 'pnpm', cache-dependency-path: 'web/pnpm-lock.yaml' }
      - uses: dtolnay/rust-toolchain@stable
      - run: cd web && pnpm install --frozen-lockfile
      - run: cd web && pnpm build
      - name: Build Tauri app
        run: |
          cargo build --release -p agent-panel-server
          mkdir -p src-tauri/binaries
          cp target/release/agent-panel-server.exe src-tauri/binaries/agent-panel-server-x86_64-pc-windows-msvc.exe
          cargo install tauri-cli --locked
          cargo tauri build --target x86_64-pc-windows-msvc
      - name: Verify artifact
        run: |
          Get-ChildItem -Recurse -Filter "*.msi" target/
          Get-ChildItem -Recurse -Filter "*.exe" target/release/
      - uses: actions/upload-artifact@v5
        with:
          name: AgentPanel-windows-x86_64
          path: target/**/bundle/msi/*.msi
