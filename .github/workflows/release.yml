name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build DMG
        run: ./scripts/build-app.sh

      - name: Verify DMG
        run: |
          set -e
          DMG=$(find target src-tauri/target -name "*.dmg" 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG found"
            exit 1
          fi
          echo "DMG: $DMG ($(ls -lh "$DMG" | awk '{print $5}'))"

          echo "--- Mounting DMG ---"
          MOUNT_POINT="/tmp/agent-panel-verify"
          hdiutil attach "$DMG" -mountpoint "$MOUNT_POINT" -nobrowse -quiet

          echo "--- Checking .app bundle ---"
          APP="$MOUNT_POINT/AgentPanel.app"
          [ -d "$APP" ] || { echo "ERROR: .app not found"; hdiutil detach "$MOUNT_POINT" -quiet; exit 1; }
          ls "$APP/Contents/MacOS/"
          ls "$APP/Contents/Resources/" | head -10

          echo "--- Checking sidecar binary ---"
          SIDECAR=$(find "$APP/Contents/MacOS" -name "agent-panel-server*" -type f | head -1)
          [ -n "$SIDECAR" ] || { echo "ERROR: sidecar binary not found"; hdiutil detach "$MOUNT_POINT" -quiet; exit 1; }
          file "$SIDECAR"

          echo "--- Checking web resources ---"
          WEB_DIST=$(find "$APP/Contents/Resources" -name "index.html" -path "*/web/*" | head -1)
          [ -n "$WEB_DIST" ] || { echo "ERROR: web/dist/index.html not found"; hdiutil detach "$MOUNT_POINT" -quiet; exit 1; }
          echo "web resources OK: $WEB_DIST"

          echo "--- Unmounting ---"
          hdiutil detach "$MOUNT_POINT" -quiet
          echo "✅ DMG verified successfully"

      - name: Generate release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${GITHUB_REF_NAME#v}"
          body=$(./scripts/release.sh "$NEW_VERSION")
          echo "Release notes:"
          echo "$body"
          {
            echo 'RELEASE_BODY<<EOF'
            echo "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(find target -name "*.dmg" 2>/dev/null | head -1)
          gh release create "$GITHUB_REF_NAME" \
            --title "Agent Panel $GITHUB_REF_NAME" \
            --notes "${{ steps.notes.outputs.RELEASE_BODY }}" \
            --draft \
            --prerelease \
            "$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: AgentPanel-macos-aarch64
          path: |
            target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/dmg/*.dmg
