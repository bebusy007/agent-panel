name: Feature Request
description: Suggest a new feature
labels: [enhancement]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Self-check
      options:
        - label: I have searched existing issues
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      placeholder: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: false
